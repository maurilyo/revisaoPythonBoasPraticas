[project]
name = "revisaopythonboaspraticas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.2",
]

[tool.ruff]
# Adiciona a pasta .astro na lista de ignorados do Ruff
extend-exclude = [".astro"]
# Adicione esta linha para o Ruff parar de encher o saco com o tamanho da linha:
ignore = ["E501"]

[tool.ruff.lint]
# E = Erros, F = Pyflakes(Lógica), N = Naming (Nomenclatura PEP-8)
select = ["E", "F", "N"]
